name: Illustrious XL v2.0
model_file: Illustrious-XL-v2.0.safetensors
category: checkpoints
workflow: txt2img
source: "https://huggingface.co/OnomaAIResearch/Illustrious-XL-v2.0（社区推荐：20-40 步，CFG 4-7，Euler a）"
params:
  steps: 32
  cfg: 6.0
  sampler: euler_ancestral
  scheduler: karras
  width: 1024
  height: 1024
prompt:
  style: danbooru_tags
  guide: Illustrious 系：标签 + 质量词，也支持自然语言描述。
negative_default: lowres, bad anatomy, bad hands, worst quality, low quality, blurry, watermark, text

# 画质增强预设（超分放大重绘 + 脸部修复）
quality:
  hires:
    upscale_model: 2x_IllustrationJaNai_V3detail_SPAN_S_40k_fp16.safetensors
    denoise: 0.45
    steps: 20
    cfg: 6.0
  face_detailer:
    detector: bbox/face_yolov8m.pt
    threshold: 0.5
    denoise: 0.35
    steps: 16
    cfg: 6.0
    guide_size: 512
    max_size: 1024

# 社区推荐分辨率（Illustrious 系：1024 基准，1536px 档画质更稳）
resolution_presets:
  - name: 方图 · 通用
    width: 1024
    height: 1024
    note: 基准档
  - name: 竖版 · 半身
    width: 896
    height: 1152
    note: 社区常用
  - name: 竖版 · 全身
    width: 832
    height: 1216
    note: 社区常用
  - name: 横版 · 半身
    width: 1152
    height: 896
    note: 社区常用
  - name: 横版 · 场景
    width: 1216
    height: 832
    note: 社区常用
  - name: 竖版 · 高画质
    width: 1024
    height: 1536
    note: 1536px 档（需足够显存）
  - name: 竖版 · 超长
    width: 1248
    height: 1824
    note: 长图（需高显存）
