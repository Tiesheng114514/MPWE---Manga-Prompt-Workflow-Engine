    width: 832
    height: 1216
    note: 官方页面推荐
  - name: 方图 · 通用
    width: 1024
    height: 1024
    note: Illustrious 系基准
  - name: 竖版 · 半身
    width: 896
    height: 1152
    note: Illustrious 系常用
  - name: 横版 · 半身
    width: 1152
    height: 896
    note: Illustrious 系常用
  - name: 竖版 · 全身
    width: 768
