        - [ ] All key props present; background tags at the end.
        - [ ] NEGATIVE contains the full template.
        - [ ] At most 3 weighted tags, quality words never weighted.
      validation:
        min_tags: 12
        max_tags: 40
        min_words: 18
        max_words: 75
        negative_required: true
        required_tags:
          - masterpiece
